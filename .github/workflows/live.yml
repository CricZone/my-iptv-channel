name: Generate Branded Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Download and Process Video (Compressed & HD)
        run: |
          VIDEO_URL=$(head -n 1 playlist.txt | tr -d '\r\n ')

          # ভিডিও ডাউনলোড
          curl -H "User-Agent: Mozilla/5.0" -L -o raw_video.mp4 "$VIDEO_URL"

          # 720p স্কেলিং ও ব্র্যান্ডিং
          ffmpeg -y -i raw_video.mp4 \
          -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='BDStreamHub TV':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=5,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Welcome to BDStreamHub - Watch Live Movies and Entertainment Non-Stop!':x=w-mod(max(t\,0)*100\,w+tw):y=h-40:fontsize=24:fontcolor=yellow:box=1:boxcolor=black@0.7:boxborderw=8" \
          -c:v libx264 -preset veryfast -b:v 1500k -maxrate 1800k -bufsize 3000k \
          -c:a aac -b:a 128k \
          branded.mp4

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete live --yes || echo "No previous release"
          git tag -d live || echo "No local tag"
          git push --delete origin live || echo "No remote tag"
          gh release create live branded.mp4 --title "Live Video Stream" --notes "Latest branded stream source"
