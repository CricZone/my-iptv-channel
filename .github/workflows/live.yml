name: Generate Branded Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Hardcode Logo & Scrollbar Permanently
        run: |
          mkdir -p video
          VIDEO_URL=$(head -n 1 playlist.txt | tr -d '\r\n ')
          
          # পুরো ভিডিওতে স্থায়ীভাবে লোগো ও টেক্সট যুক্ত করে একটি পারফেক্ট mp4 তৈরি
          ffmpeg -i "$VIDEO_URL" \
          -vf "drawtext=text='BDStreamHub TV':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=5,drawtext=text='Welcome to BDStreamHub - Watch Live Movies and Entertainment Non-Stop!':x=w-mod(max(t\,0)*100\,w+tw):y=h-40:fontsize=24:fontcolor=yellow:box=1:boxcolor=black@0.7:boxborderw=8" \
          -c:v libx264 -preset fast -crf 22 \
          -c:a aac -b:a 128k \
          video/branded.mp4

      - name: Commit Branded Video
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add video/branded.mp4
          git commit -m "Add pre-rendered branded video" || echo "No changes"
          git push
