name: 24/7 Live Streamer

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Stream Directly From YouTube (Bypass Block)
        run: |
          mkdir -p live
          
          # playlist.txt থেকে প্রথম ইউটিউব লিঙ্ক নেওয়া
          YT_URL=$(head -n 1 playlist.txt)
          
          # অ্যান্ড্রয়েড ক্লায়েন্ট দিয়ে ইউটিউব ব্লক বাইপাস করে সরাসরি পাইপ স্ট্রিম
          yt-dlp --extractor-args "youtube:player_client=android" -f "best[ext=mp4]/best" -o - "$YT_URL" | \
          timeout 50s ffmpeg -re -i pipe:0 \
          -vf "drawtext=text='BDStreamHub TV':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=5, \
          drawtext=text='Welcome to BDStreamHub - Watch Live YouTube Streams Non-Stop!':x=w-mod(max(t\,0)*100\,w+tw):y=h-40:fontsize=24:fontcolor=yellow:box=1:boxcolor=black@0.7:boxborderw=8" \
          -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2200k -bufsize 4000k \
          -c:a aac -b:a 128k \
          -f hls -hls_time 6 -hls_list_size 10 -hls_flags delete_segments live/stream.m3u8 || true

      - name: Commit and Push Stream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live/
          git commit -m "Live YouTube Stream Updated" || echo "No changes"
          git push
