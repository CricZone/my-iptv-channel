name: Generate Branded Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Download and Process Video
        run: |
          mkdir -p video
          VIDEO_URL=$(head -n 1 playlist.txt | tr -d '\r\n ')

          # ১. ব্রাউজার অনুকরণ করে ভিডিও ডাউনলোড
          curl -H "User-Agent: Mozilla/5.0" -L -o raw_video.mp4 "$VIDEO_URL"

          # ২. সিস্টেম ফন্ট ব্যবহার করে লোগো ও স্ক্রোলিং যুক্ত করা
          ffmpeg -y -i raw_video.mp4 \
          -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='BDStreamHub TV':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=5,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='Welcome to BDStreamHub - Watch Live Movies and Entertainment Non-Stop!':x=w-mod(max(t\,0)*100\,w+tw):y=h-40:fontsize=24:fontcolor=yellow:box=1:boxcolor=black@0.7:boxborderw=8" \
          -c:v libx264 -preset ultrafast -crf 22 \
          -c:a aac -b:a 128k \
          video/branded.mp4

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --rebase
          git add video/branded.mp4
          git commit -m "Add branded video" || echo "No changes"
          git push
