name: 24/7 Live Streamer

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch YouTube Stream via Invidious & Render
        run: |
          mkdir -p live
          
          RAW_URL=$(head -n 1 playlist.txt | tr -d '\r\n ')
          
          # ইউটিউব ভিডিও আইডি বের করা
          if [[ "$RAW_URL" =~ (youtu\.be\/|v=|\/embed\/|\/shorts\/)([a-zA-Z0-9_-]{11}) ]]; then
            VIDEO_ID="${BASH_REMATCH[2]}"
          else
            VIDEO_ID="$RAW_URL"
          fi
          
          echo "Processing YouTube Video ID: $VIDEO_ID"

          # ব্লকহীন ফ্রি পাবলিক ইনভিডিয়াস API থেকে ডাইরেক্ট স্ট্রিম লিংক নেওয়া
          STREAM_URL=$(curl -s "https://inv.tux.pizza/api/v1/videos/$VIDEO_ID" | grep -oP '"url":"\Khttps:[^"]+' | grep "googlevideo.com" | head -n 1 | sed 's/\\u0026/\&/g')
          
          # ব্যাকআপ প্রক্সি যদি প্রথমটি কাজ না করে
          if [ -z "$STREAM_URL" ]; then
            STREAM_URL="https://pipedproxy.kavin.rocks/videoplayback?id=$VIDEO_ID"
          fi

          # সরাসরি FFmpeg-এ স্ট্রিম পাঠিয়ে লাইভ তৈরি
          timeout 50s ffmpeg -re -i "$STREAM_URL" \
          -vf "drawtext=text='BDStreamHub TV':x=w-tw-30:y=30:fontsize=32:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=5, \
          drawtext=text='Welcome to BDStreamHub - Watch Live YouTube Streams Non-Stop!':x=w-mod(max(t\,0)*100\,w+tw):y=h-40:fontsize=24:fontcolor=yellow:box=1:boxcolor=black@0.7:boxborderw=8" \
          -c:v libx264 -preset veryfast -b:v 1800k \
          -c:a aac -b:a 128k \
          -f hls -hls_time 6 -hls_list_size 10 -hls_flags delete_segments live/stream.m3u8 || true

      - name: Commit and Push Stream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live/
          git commit -m "Live YouTube Stream Updated" || echo "No changes"
          git push
