name: Auto Download YouTube & Update Playlist

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video Link'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          sudo pip3 install --break-system-packages -U yt-dlp

      - name: Download HD Video
        run: |
          mkdir -p videos
          # ইউটিউব বট বাইপাস ও 720p/HD কমপ্যাক্ট ডাউনলোড
          yt-dlp --extractor-args "youtube:player_client=android" \
            -f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best" \
            --merge-output-format mp4 \
            -o "videos/stream.mp4" "${{ inputs.youtube_url }}"

      - name: Update Playlist
        run: |
          echo "videos/stream.mp4" > playlist.txt

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --rebase
          git add videos/stream.mp4 playlist.txt
          git commit -m "Auto updated video from YouTube" || echo "No changes"
          git push origin main
