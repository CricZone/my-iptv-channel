name: Auto Download YouTube & Update Playlist

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video Link'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install yt-dlp & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip3 install -U yt-dlp

      - name: Download Full HD Video
        run: |
          mkdir -p videos
          # সেরা কোয়ালিটিতে (1080p/Best) ডাউনলোড
          yt-dlp --extractor-args "youtube:player_client=android" \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 \
            -o "videos/stream.mp4" "${{ inputs.youtube_url }}"

      - name: Update Playlist Text File
        run: |
          # লোকাল ফাইলের পাথ playlist.txt-এ স্বয়ংক্রিয়ভাবে সেট করা
          echo "videos/stream.mp4" > playlist.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add videos/stream.mp4 playlist.txt
          git commit -m "Auto updated video from YouTube" || echo "No changes"
          git push origin main
