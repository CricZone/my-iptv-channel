name: Generate Live HLS Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  build-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Process Video and Generate Live Segments
        run: |
          rm -rf live
          mkdir -p live

          if [ ! -f "playlist.txt" ]; then
            echo "playlist.txt not found!"
            exit 1
          fi

          RAW_URL=$(grep -v '^#' playlist.txt | grep -m 1 '^http')
          echo "Original URL: $RAW_URL"

          # লিঙ্ক থেকে ফাইল আইডি আলাদা করা
          FILE_ID=$(echo "$RAW_URL" | grep -oP '(?<=id=)[a-zA-Z0-9_-]+|(?<=/d/)[a-zA-Z0-9_-]+' | head -n 1)
          echo "Extracted File ID: $FILE_ID"

          if [ -z "$FILE_ID" ]; then
            echo "Direct link download attempt..."
            curl -s -L "$RAW_URL" -o temp_video.mp4
          else
            echo "Downloading with Google Drive Cookie Bypass..."
            # গুগল ড্রাইভের ভাইরাস স্ক্যান ওয়ার্নিং বাইপাস লজিক
            curl -c ./cookie.txt -s -L "https://drive.google.com/uc?export=download&id=${FILE_ID}" > /dev/null
            CONFIRM_CODE=$(grep -oP 'download_warning_[0-9A-Za-z_]+' ./cookie.txt | head -n 1)
            
            if [ -n "$CONFIRM_CODE" ]; then
              CONFIRM_VAL=$(grep "$CONFIRM_CODE" ./cookie.txt | awk '{print $NF}')
              curl -Lb ./cookie.txt "https://drive.google.com/uc?export=download&confirm=${CONFIRM_VAL}&id=${FILE_ID}" -o temp_video.mp4
            else
              curl -Lb ./cookie.txt "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" -o temp_video.mp4
            fi
            rm -f ./cookie.txt
          fi

          # ডাউনলোড করা ফাইলটি আসল এমপিফোর ভিডিও কিনা ভ্যালিডেট করা
          FILE_TYPE=$(file -b --mime-type temp_video.mp4)
          echo "Downloaded file MIME type: $FILE_TYPE"

          if [[ "$FILE_TYPE" != video/* ]]; then
            echo "Error: Downloaded file is not a valid video! It is $FILE_TYPE (Probably Google HTML block)"
            cat temp_video.mp4 | head -n 20
            exit 1
          fi

          # HLS এনকোডিং
          ffmpeg -y \
            -i temp_video.mp4 \
            -c copy \
            -f hls \
            -hls_time 3 \
            -hls_list_size 6 \
            -hls_flags delete_segments+append_list+omit_endlist \
            live/stream.m3u8

          rm -f temp_video.mp4

      - name: Commit and Push to Live Folder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live/
          git commit -m "Update full crystal clear stream [skip ci]" || echo "No changes to commit"
          git push
