name: Generate Live HLS Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  build-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Process Video and Generate Live Segments
        run: |
          rm -rf live
          mkdir -p live

          if [ ! -f "playlist.txt" ]; then
            echo "playlist.txt not found!"
            exit 1
          fi

          VIDEO_URL=$(grep -v '^#' playlist.txt | grep -m 1 '^http')
          echo "Processing URL: $VIDEO_URL"

          # গুগল ড্রাইভ ফাইল লোকাল মেশিনে নিশ্চিত নামানো
          curl -s -L -A "Mozilla/5.0" "$VIDEO_URL" -o temp_video.mp4

          # যদি HTML বা খালি ফাইল আসে চেক করা
          if [ ! -s temp_video.mp4 ]; then
            echo "Failed to fetch video file from Drive link!"
            exit 1
          fi

          ffmpeg -y \
            -i temp_video.mp4 \
            -c copy \
            -f hls \
            -hls_time 3 \
            -hls_list_size 6 \
            -hls_flags delete_segments+append_list+omit_endlist \
            live/stream.m3u8

          rm -f temp_video.mp4

      - name: Commit and Push to Live Folder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live/
          git commit -m "Update full crystal clear stream [skip ci]" || echo "No changes to commit"
          git push
