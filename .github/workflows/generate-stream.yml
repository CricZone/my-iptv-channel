name: Generate Live HLS Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

concurrency:
  group: bdstreamhub-live
  cancel-in-progress: true

jobs:
  build-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install FFmpeg and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl wget file jq python3-pip
          pip3 install --upgrade yt-dlp --break-system-packages || pip install --upgrade yt-dlp

      - name: Prepare Directories
        run: |
          rm -rf live videos
          mkdir -p live videos

      - name: Check Playlist
        run: |
          if [ ! -f "playlist.txt" ]; then
            echo "❌ playlist.txt not found!"
            exit 1
          fi
          TOTAL=$(grep -v '^#' playlist.txt | grep -E '^https?://' | wc -l)
          echo "Total videos: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ playlist.txt has no valid URLs!"
            exit 1
          fi

      - name: Create Video List
        run: |
          grep -v '^#' playlist.txt | grep -E '^https?://' > video_urls.txt
          nl -ba video_urls.txt

      - name: Download Videos
        shell: bash
        run: |
          set +e
          TOTAL=$(wc -l < video_urls.txt)
          INDEX=0
          rm -f downloaded.txt
          touch downloaded.txt

          while IFS= read -r RAW_URL; do
            INDEX=$((INDEX + 1))
            echo "========================================"
            echo "Downloading Video $INDEX / $TOTAL"
            echo "========================================"

            FILE_ID=$(echo "$RAW_URL" | grep -oP '(?<=/d/)[a-zA-Z0-9_-]+|(?<=[?&]id=)[a-zA-Z0-9_-]+' | head -n 1)
            OUTPUT="videos/video_${INDEX}.mp4"
            SUCCESS=0

            if [ -n "$FILE_ID" ]; then
              TARGET_URL="https://drive.google.com/file/d/${FILE_ID}/view"
            else
              TARGET_URL="$RAW_URL"
            fi

            echo "Target URL: $TARGET_URL"

            # yt-dlp গুগলের কোটা লিমিট বাইপাস করে সরাসরি ভিডিও স্ট্রিম নামায়
            yt-dlp \
              --no-check-certificates \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36" \
              -f "bestvideo+bestaudio/best" \
              --merge-output-format mp4 \
              -o "$OUTPUT" \
              "$TARGET_URL" || true

            if [ -s "$OUTPUT" ]; then
              FILE_SIZE=$(stat -c%s "$OUTPUT")
              if [ "$FILE_SIZE" -gt 1048576 ]; then
                echo "$OUTPUT" >> downloaded.txt
                echo "✅ Video $INDEX downloaded successfully ($((FILE_SIZE / 1024 / 1024)) MB)."
                SUCCESS=1
              fi
            fi

            if [ "$SUCCESS" -ne 1 ]; then
              echo "⚠️ Video $INDEX failed, skipping."
            fi
          done < video_urls.txt

          COUNT=$(wc -l < downloaded.txt)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No valid videos downloaded."
            exit 1
          fi

      - name: Create FFmpeg Concat Playlist
        run: |
          rm -f concat.txt
          while IFS= read -r VIDEO; do
            ABS_PATH="$(realpath "$VIDEO")"
            echo "file '$ABS_PATH'" >> concat.txt
          done < downloaded.txt
          cat concat.txt

      - name: Generate Continuous HLS
        shell: bash
        run: |
          set -e
          ffmpeg -hide_banner -loglevel warning -re \
            -stream_loop -1 \
            -f concat -safe 0 -i concat.txt \
            -map 0:v:0? -map 0:a:0? \
            -c:v copy -c:a aac -b:a 128k \
            -f hls \
            -hls_time 4 \
            -hls_list_size 10 \
            -hls_flags delete_segments+append_list \
            -hls_segment_filename "live/stream%d.ts" \
            live/stream.m3u8 &
          
          FFMPEG_PID=$!
          
          for i in {1..450}; do
            sleep 40
            if [ -f "live/stream.m3u8" ]; then
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add live/*.m3u8 live/*.ts
              git commit -m "Update live stream segments [skip ci]" || true
              git push origin main || true
            fi
          done
          
          kill -9 $FFMPEG_PID || true
