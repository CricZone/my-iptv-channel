name: Generate Live HLS Stream

on:
  workflow_dispatch: # ম্যানুয়ালি রান করার বাটন চালু রাখবে
  schedule:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিট পরপর অটো রান হয়ে আপডেট রাখবে

permissions:
  contents: write # গিটহাবে ফাইল পুশ করার পারমিশন

jobs:
  build-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Process Video and Generate Live Segments
        run: |
          # পুরনো live ফোল্ডার মুছে একদম ফ্রেশ ডিরেক্টরি বানানো
          rm -rf live
          mkdir -p live

          # playlist.txt চেক করা
          if [ ! -f "playlist.txt" ]; then
            echo "playlist.txt not found!"
            exit 1
          fi

          # প্রথম কার্যকর লিংক নেওয়া
          VIDEO_URL=$(grep -v '^#' playlist.txt | grep -m 1 '^http')
          echo "Processing URL: $VIDEO_URL"

          # FFmpeg দিয়ে ফ্রেশ HLS তৈরি
          ffmpeg -y \
            -headers "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)\r\n" \
            -i "$VIDEO_URL" \
            -c copy \
            -f hls \
            -hls_time 3 \
            -hls_list_size 6 \
            -hls_flags delete_segments+append_list+omit_endlist \
            live/stream.m3u8

      - name: Commit and Push to Live Folder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live/
          git commit -m "Auto Update fresh live stream [skip ci]" || echo "No changes to commit"
          git push
